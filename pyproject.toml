[project]
name = "pancreasignal"
version = "0.1.0"
description = "Biomarker-based PDAC risk triage: calibrated per-test models + agentic intake, guideline RAG and eval harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "shap>=0.46",
    "pyyaml>=6.0",
    "requests>=2.32",
    "tqdm>=4.66",
    "kaggle>=1.6",
]

[project.optional-dependencies]
tracking = ["mlflow>=2.16"]
notebook = ["jupyter>=1.1", "matplotlib>=3.9", "seaborn>=0.13"]
api = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.8"]
dev = ["pytest>=8.3", "ruff>=0.6", "nbstripout>=0.7", "httpx>=0.27"]   # httpx: FastAPI TestClient

[project.scripts]
pancreasignal-train = "pancreasignal.train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pancreasignal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
