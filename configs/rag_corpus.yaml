#                        (TITLE_ABS:"CA19-9" OR TITLE_ABS:"CA 19-9") AND (TITLE_ABS:"false positive" OR TITLE_ABS:"Lewis" OR TITLE_ABS:"cholestasis" OR TITLE_ABS:"jaundice") AND (TITLE_ABS:"pancreatic" OR TITLE_ABS:"pancreas") AND PUB_YEAR:[2012 TO 2026]
