# Corpus for the guideline RAG (Phase 8). Open-license articles only.
#
# Source: Europe PMC. Full text (XML) for each article:
#   https://www.ebi.ac.uk/europepmc/webservices/rest/{pmcid}/fullTextXML
# Chosen on 2026-11-11 from Europe PMC searches (open access, full text in Europe PMC, most-cited first),
# one search per topic; the queries are listed at the bottom so the selection can be repeated.
#
# License policy: a free-to-read article is NOT enough; it must carry an open license.
#   BY = credit the source (the RAG always cites), NC = non-commercial use only (personal portfolio: OK),
#   ND = no derivatives (keep chunks verbatim, never publish rewritten versions of the article).
# Excluded on purpose:
#   - CAPS 2020 (Gut, PMC7295005): free to read in PMC but no license -> its recommendations come in through
#     the open reviews below that summarise them.
#   - Kyoto 2024 IPMN guidelines (Pancreatology, PMID 38182527): CC BY-NC-ND but not in PMC, so no XML
#     full text via Europe PMC. Answers about Kyoto-specific criteria are therefore NOT supported.

allowed_licenses: [cc0, cc by, cc by-sa, cc by-nc, cc by-nc-sa, cc by-nc-nd]

articles:
  # ---------------------------------------------------------------- CA19-9: use and limits
